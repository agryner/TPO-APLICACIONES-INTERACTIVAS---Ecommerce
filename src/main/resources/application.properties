spring.application.name=marketplace
server.port=4002

# Configuracion propia de cada maquina, fuera del repo: hoy solo la clave de
# Gemini. El prefijo optional: hace que la app arranque igual si el archivo no
# esta, que es lo que pasa cuando alguien clona el proyecto por primera vez.
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=jdbc:mysql://localhost:3306/marketplace
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=lucca

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# El carrito se vacia solo si no se toca durante este tiempo (en minutos).
# 43200 = 30 dias. El plazo corre desde la ultima vez que se modifico, no desde
# que se creo: cada operacion lo empuja hacia adelante.
marketplace.carrito.minutos-vigencia=43200

# La wishlist dura mucho mas porque no es una compra en curso sino una lista de
# intenciones: se mira cada tanto, no todos los dias.
marketplace.wishlist.meses-vigencia=8

# DevTools fuerza sus propios defaults por encima de este archivo, y uno de ellos
# es devolver el stacktrace completo en cada error. Lo desactivamos.
spring.devtools.add-properties=false
spring.web.error.include-stacktrace=never
spring.web.error.include-message=always

# Subida de archivos. El default de Spring es 1MB por archivo, muy poco para fotos.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Verificacion automatica de fotos contra la categoria del producto.
#
# La clave NO va aca: este archivo se versiona y el repo es publico, asi que
# GitHub rechaza el push si la encuentra. Vive en application-local.properties,
# que esta en .gitignore y se importa arriba de todo. La variable de entorno
# GEMINI_API_KEY tambien sirve y le gana a las dos.
#
# Si no hay clave por ninguna via, la verificacion falla sola y las fotos
# quedan EN_REVISION en vez de romper la subida.
marketplace.ia.api-key=${GEMINI_API_KEY:}
marketplace.ia.modelo=gemini-3.6-flash
# Gemini puede tardar 40 segundos o mas con una imagen. Si se corta, la foto
# queda EN_REVISION y la subida no falla, pero conviene darle margen.
marketplace.ia.timeout-segundos=60
# Arriba de umbral-aprobacion la foto entra directo; abajo de umbral-rechazo se
# rechaza la subida; en el medio se guarda EN_REVISION esperando a un admin.
marketplace.ia.umbral-aprobacion=0.7
marketplace.ia.umbral-rechazo=0.4
